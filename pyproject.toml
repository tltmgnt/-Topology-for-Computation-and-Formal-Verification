[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-topology"
version = "0.1.0"
description = "Explicit finite-state topology, obligation checking and verifiable certificates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
researchos = "researchos.__main__:main"
formal-topology = "formal_topology.__main__:main"

[tool.setuptools.packages.find]
include = ["formal_topology*", "researchos*"]

[tool.setuptools.package-data]
researchos = ["*.json"]
